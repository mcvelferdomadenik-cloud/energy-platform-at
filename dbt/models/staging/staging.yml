version: 2

# Every test is an error. A test may be `warn` only with a comment above it saying why.

models:
  - name: stg_metering_point
    description: Our metering points, one row per registration, each valid until the next.
    data_tests:
      - dbt_expectations.expect_compound_columns_to_be_unique:
          arguments:
            column_list: [metering_point, valid_from]
    columns:
      - name: metering_point
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: "^AT[0-9A-Z]{31}$"
      - name: segment
        data_tests:
          - accepted_values:
              arguments:
                values: [household, business, municipality]
      - name: annual_kwh
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: true

  - name: stg_meter_reading
    description: One true reading per metering point per quarter hour, with its registration.
    data_tests:
      - dbt_expectations.expect_compound_columns_to_be_unique:
          arguments:
            column_list: [metering_point, interval_start]
      - dbt_expectations.expect_column_pair_values_A_to_be_greater_than_B:
          arguments:
            column_A: consumption_kwh
            column_B: allocated_kwh
            or_equal: true
    columns:
      - name: consumption_kwh
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: allocated_kwh
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: version
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
      - name: meter_matches_registry
        data_tests:
          # warn, not error: a reading sent under the old meter id after a swap is a data-quality
          # finding about the sender, kept and flagged, not a reason to stop the pipeline.
          - accepted_values:
              arguments:
                values: [true]
              config:
                severity: warn

  - name: stg_community_interval
    description: Community generation and consumption per quarter hour, latest version.
    columns:
      - name: interval_start
        data_tests: [unique, not_null]
      - name: generation_kwh
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: consumption_kwh
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0

  - name: stg_day_ahead_price
    description: One day-ahead price per bidding zone and interval.
    data_tests:
      - dbt_expectations.expect_compound_columns_to_be_unique:
          arguments:
            column_list: [bidding_zone, interval_start]
    columns:
      - name: bidding_zone
        data_tests:
          - accepted_values:
              arguments:
                values: ["10YAT-APG------L"]
      - name: price_eur_mwh
        data_tests:
          - not_null
          # The harmonised clearing price limits of the EU coupled day-ahead market (SDAC):
          # -500 and +4000 EUR/MWh. A value outside them is not a price.
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -500
                max_value: 4000

  - name: stg_imbalance_price
    description: One imbalance price per control area, interval and direction; final beats intermediate.
    data_tests:
      - dbt_expectations.expect_compound_columns_to_be_unique:
          arguments:
            column_list: [control_area, interval_start, category]
    columns:
      - name: control_area
        data_tests:
          # The marts join imbalance prices by quarter hour alone. A second area in this table would
          # not fail anything downstream: the higher of two prices would simply win.
          - accepted_values:
              arguments:
                values: ["10YAT-APG------L"]
      - name: direction
        data_tests:
          - accepted_values:
              arguments:
                values: [long, short]
      - name: price_eur_mwh
        data_tests:
          - not_null
          # The harmonised maximum and minimum balancing energy prices of the EU platforms:
          # +/- 15000 EUR/MWh. An imbalance price outside them is not a price.
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -15000
                max_value: 15000

  - name: stg_actual_load
    description: Realised total load of the bidding zone per interval, in MW.
    data_tests:
      - dbt_expectations.expect_compound_columns_to_be_unique:
          arguments:
            column_list: [bidding_zone, interval_start]
    columns:
      - name: load_mw
        data_tests:
          - not_null
          # Plausibility only: Austria peaks around 12 GW, so 20 GW is a unit mix-up, not a load.
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 20000
                strictly: true

  - name: stg_weather_hourly
    description: Hourly temperature and global radiation per location. Source GeoSphere Austria, CC BY 4.0.
    data_tests:
      - dbt_expectations.expect_compound_columns_to_be_unique:
          arguments:
            column_list: [dataset, latitude, longitude, valid_at]
    columns:
      - name: temperature_c
        data_tests:
          # Plausibility: the Austrian records are about -53 and +41 degrees.
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: -60
                max_value: 50
      - name: global_radiation_w_m2
        data_tests:
          # The sun delivers about 1361 W m-2 above the atmosphere; more on the ground is an error.
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1400

  - name: stg_load_profile
    description: Official APCS synthetic load profiles, one value per profile and interval.
    data_tests:
      - dbt_expectations.expect_compound_columns_to_be_unique:
          arguments:
            column_list: [profile_type, interval_start]
    columns:
      - name: value
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
