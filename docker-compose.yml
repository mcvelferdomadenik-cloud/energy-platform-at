name: megavolt

x-warehouse-image: &warehouse-image
  image: timescale/timescaledb:2.30.0-pg17@sha256:3113d12b78392c064aa7475caf7a52b447b29ddd4f9bfd23526733fcb03e3459

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  image: megavolt/airflow:3.3.1
  # Built here and nowhere else. The name is not ours on any registry, so never pull it.
  pull_policy: build
  restart: unless-stopped
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in .env}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set AIRFLOW_JWT_SECRET in .env}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
      postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}@airflow-db/airflow
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - airflow_logs:/opt/airflow/logs
  depends_on:
    airflow-db:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully

services:
  warehouse:
    <<: *warehouse-image
    container_name: megavolt-warehouse
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      WAREHOUSE_WRITER_PASSWORD: ${WAREHOUSE_WRITER_PASSWORD:?set WAREHOUSE_WRITER_PASSWORD in .env}
      WAREHOUSE_DBT_PASSWORD: ${WAREHOUSE_DBT_PASSWORD:?set WAREHOUSE_DBT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  airflow-db:
    <<: *warehouse-image
    container_name: megavolt-airflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 12

  airflow-init:
    <<: *airflow-common
    container_name: megavolt-airflow-init
    restart: "no"
    command: version
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:?set AIRFLOW_ADMIN_USER in .env}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in .env}
    depends_on:
      airflow-db:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow-common
    container_name: megavolt-airflow-apiserver
    command: api-server
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  airflow-scheduler:
    <<: *airflow-common
    container_name: megavolt-airflow-scheduler
    command: scheduler
    environment:
      <<: *airflow-env
      ENTSOE_API_TOKEN: ${ENTSOE_API_TOKEN:?set ENTSOE_API_TOKEN in .env}
      # Tasks run here, so this is the one Airflow container that writes to the warehouse.
      WAREHOUSE_DSN: >-
        postgresql://megavolt_writer:${WAREHOUSE_WRITER_PASSWORD:?set WAREHOUSE_WRITER_PASSWORD in .env}@warehouse:5432/${POSTGRES_DB}
      # meter_stream_daily runs here. The seed must be the one the laptop uses, or a scheduled
      # day and a hand-run day would produce different readings for the same date.
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      SIMULATOR_SEED: ${SIMULATOR_SEED:-megavolt}
      # dbt_build runs here too, as its own database role (db/init/03_dbt_role.sh).
      WAREHOUSE_HOST: warehouse
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_DBT_PASSWORD: ${WAREHOUSE_DBT_PASSWORD:?set WAREHOUSE_DBT_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}

  airflow-dag-processor:
    <<: *airflow-common
    container_name: megavolt-airflow-dag-processor
    command: dag-processor

  # dev-container mode runs a single broker with no authentication at all, which is why only
  # the loopback port is published: anything that can reach 19092 can read every meter reading
  # in the cluster. Two listeners because the addresses differ by who is asking -
  # containers resolve "redpanda", the laptop resolves 127.0.0.1.
  redpanda:
    image: redpandadata/redpanda:v26.2.2@sha256:468bd13a9f2bd24794cb7fddc867c767fb1008b9a07b297b89fde48c564d7d96
    container_name: megavolt-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:19092
    ports:
      - "127.0.0.1:19092:19092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # The dead-letter topic has to exist before the first unreadable message arrives, or that
  # message is lost and the control it implements is worthless.
  redpanda-init:
    image: redpandadata/redpanda:v26.2.2@sha256:468bd13a9f2bd24794cb7fddc867c767fb1008b9a07b297b89fde48c564d7d96
    container_name: megavolt-redpanda-init
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for topic in meter.readings.v1 meter.readings.dlq.v1; do
          rpk topic create "$$topic" --brokers redpanda:9092 --partitions 3 --replicas 1 \
            || rpk topic describe "$$topic" --brokers redpanda:9092 > /dev/null
        done
        rpk topic list --brokers redpanda:9092
    depends_on:
      redpanda:
        condition: service_healthy

  # Reads meter.readings.v1 into the warehouse, all the time. Reuses the Airflow image because it
  # already carries the megavolt package, but not the Airflow environment: its own environment
  # below holds the two addresses it needs and no other secret.
  meter-consumer:
    image: megavolt/airflow:3.3.1
    # The image the Airflow services build; never looked up on a registry.
    pull_policy: never
    container_name: megavolt-meter-consumer
    restart: unless-stopped
    command: python -m megavolt.consumer
    environment:
      WAREHOUSE_DSN: >-
        postgresql://megavolt_writer:${WAREHOUSE_WRITER_PASSWORD:?set WAREHOUSE_WRITER_PASSWORD in .env}@warehouse:5432/${POSTGRES_DB}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    # A batch can take several seconds to write. The consumer finishes it on SIGTERM, and the
    # default 10 s would kill it mid-batch - harmless thanks to the commit order, but noisy.
    stop_grace_period: 30s
    depends_on:
      warehouse:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      # Builds the image this service runs; without it a first start finds no image.
      airflow-init:
        condition: service_completed_successfully

volumes:
  warehouse_data:
  airflow_db_data:
  airflow_logs:
  redpanda_data:
