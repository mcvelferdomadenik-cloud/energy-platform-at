[project]
name = "megavolt"
version = "0.1.0"
description = "Settlement and pricing platform for MegaVolt, a fictional Austrian electricity supplier"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "defusedxml>=0.7.1",
    "httpx>=0.28.1",
    # Exact: these three must match the Airflow 3.3.1 constraints file, so the laptop and
    # the Airflow image run identical code. Bump them together with the Airflow version.
    "confluent-kafka==2.15.0",
    "psycopg[binary]==3.3.4",
    "python-dotenv==1.2.2",
    "tzdata>=2026.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/megavolt", "src/megavolt_tool"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "dags"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes: unused imports, undefined names
    "I",   # import sorting
    "UP",  # rewrite to modern Python syntax
    "B",   # bugbear: likely bugs
    "S",   # bandit: security issues
]
ignore = ["S101"] # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.uv]
# dbt and web are installed by default so `uv run dbt` and the tool's tests work on the laptop and
# in CI; the Airflow image installs only dbt from this lock file, hashes and all. The tool group
# holds the private pricing engine and is installed only where the tool runs (a token is needed).
default-groups = ["dev", "dbt", "web"]

[tool.uv.sources]
megavolt-pricing = { git = "https://github.com/mcvelferdomadenik-cloud/megavolt-pricing" }

[dependency-groups]
dbt = [
    "dbt-postgres==1.11.0",
]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.6",
]
tool = [
    "megavolt-pricing",
]
web = [
    "fastapi>=0.120",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "uvicorn>=0.38",
]
