# Dependabot opens pull requests for outdated dependencies. Nothing merges on its own: every
# update goes through CI and a human review like any other change.
# Version updates come once a month, grouped, so they are one review and not a stream. Security
# updates do not follow this schedule: a known vulnerability opens a pull request at once.
version: 2

updates:
  # The laptop's Python environment. Every runtime dependency is also installed into the Airflow
  # image under the Airflow constraints file, which pins each of them to one exact version: a bump
  # Airflow has not made cannot be resolved there and breaks the image build, while CI, which
  # does not build the image, stays green. They move only with a deliberate Airflow upgrade.
  # What is left for Dependabot here is the tooling: ruff, pytest and dbt.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: confluent-kafka
      - dependency-name: defusedxml
      - dependency-name: httpx
      - dependency-name: psycopg
      - dependency-name: psycopg-binary
      - dependency-name: python-dotenv
      - dependency-name: tzdata
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # airflow/requirements.txt has no entry of its own: it repeats the runtime dependencies above at
  # the versions in uv.lock, and tests/test_airflow_requirements.py keeps the two identical.

  # The Airflow base image is ignored: its version is repeated in the pip install line and in
  # the constraints file URL, and bumping only the FROM line leaves a mismatched image.
  # Airflow upgrades are a manual task.
  - package-ecosystem: docker
    directory: /airflow
    schedule:
      interval: monthly
    ignore:
      - dependency-name: apache/airflow

  # Warehouse and broker images, kept pinned by digest. A major TimescaleDB or Postgres version
  # cannot read a data volume written by the previous one, so majors are never proposed.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: timescale/timescaledb
        update-types: [version-update:semver-major]

  # Actions are pinned to commit SHAs; Dependabot moves the SHA and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
