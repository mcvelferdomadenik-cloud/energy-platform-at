name: CI

on:
  # Every branch, not only main: a secret pushed to a feature branch is already public to anyone
  # with access, and the sooner the scan says so, the sooner the credential gets rotated.
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # From the release's checksums file, and recomputed independently before pinning.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so the secret scan below sees every commit, not only the last.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLf -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      # The pre-commit hook runs the same scan on staged changes, but a hook is local and
      # `git commit --no-verify` skips it. This step cannot be skipped.
      - name: Scan the whole history for secrets
        run: |
          gitleaks git . --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore \
            --redact --verbose --no-banner
