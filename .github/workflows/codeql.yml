name: CodeQL

# GitHub's static analysis, on every pull request before it can reach main. The repository keeps
# its files out of the language statistics (.gitattributes), so the automatic setup cannot see the
# Python here; the languages are named explicitly instead.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: new queries find old code.
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Uploading the findings is the only write this workflow needs.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:${{ matrix.language }}
