{% extends "base.html" %}
{% block main_class %}full{% endblock %}
{% block content %}
<div class="signin"><div class="card narrow">
  <span class="mark"></span>
  <h1>Sign in</h1>
  <p class="muted">Internal tool. Use your MegaVolt account.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/signin">
    <label for="email">Email</label>
    <input id="email" type="email" name="email" required autocomplete="username" autofocus>
    <label for="password">Password</label>
    <input id="password" type="password" name="password" required autocomplete="current-password">
    <button type="submit">Sign in</button>
  </form>
</div></div>
{% endblock %}
